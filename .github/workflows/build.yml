name: CI Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Clean broken apt sources
      run: |
        sudo rm -f /etc/apt/sources.list.d/openjdk-r-ubuntu-ppa*.list
        sudo rm -f /etc/apt/sources.list.d/*.save
        sudo apt-get update

    - name: Install dependencies
      run: |
        sudo apt-get install -y \
          python3-pip \
          build-essential \
          ccache \
          libffi-dev \
          libssl-dev \
          git \
          zip \
          unzip \
          autoconf \
          libtool \
          pkg-config \
          zlib1g-dev \
          libncurses5-dev \
          libncursesw5-dev \
          libreadline-dev

    - name: Install Buildozer and dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install --upgrade buildozer cython==0.29.36

    - name: Build with Buildozer
      run: buildozer -v android debug

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk